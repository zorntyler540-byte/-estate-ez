<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 320px; padding: 12px; font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; font-size: 13px; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    label { display: block; margin-top: 10px; margin-bottom: 4px; color: #aaa; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; }
    button { width: 100%; margin-top: 10px; padding: 10px; background: #008080; color: white; border: none; cursor: pointer; border-radius: 6px; font-weight: 600; }
    button.secondary { background: #333; }
    button:hover { filter: brightness(1.08); }
    #status { margin: 10px 0 0; font-size: 12px; color: #bbb; line-height: 1.4; }
    .hint { font-size: 11px; color: #888; margin-top: 6px; line-height: 1.35; }
  </style>
</head>
<body>
  <h3>Estate-Ez → CT Seller</h3>
  <p class="hint">Use the <strong>toolbar icon</strong> to open the <strong>side panel</strong> (v1.0.3+). This popup file is no longer the default UI.</p>
  <div id="authPanel" style="border:1px solid #2a2a2a; border-radius:8px; padding:8px; margin-top:8px;">
    <strong>Sign in</strong>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="username" />
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
    <button type="button" id="loginBtn">Sign in</button>
    <button type="button" class="secondary" id="logoutBtn" style="display:none;">Log out</button>
    <div id="authState" class="hint" style="margin-top:8px;">Not signed in.</div>
  </div>
  <button type="button" class="secondary" id="previewBtn">Preview current lot</button>
  <button type="button" id="fillBtn">Fill current lot on page</button>
  <button type="button" id="uploadBtn">Upload lot photos to media page</button>
  <p id="status">Ready.</p>
  <div id="currentLot" style="margin-top:8px; border:1px solid #2a2a2a; border-radius:8px; padding:8px;">
    <strong>Current lot</strong>
    <div id="currentLotMeta" style="margin-top:4px; font-size:11px; color:#b8c2d1;">Not loaded yet.</div>
    <div style="display:flex; gap:6px; margin-top:6px;">
      <button type="button" class="secondary" id="prevLotBtn" style="margin-top:0; padding:6px;">Previous</button>
      <button type="button" class="secondary" id="nextLotBtn" style="margin-top:0; padding:6px;">Next</button>
    </div>
    <img id="currentLotThumb" alt="Current lot thumbnail" style="display:none; width:100%; max-height:140px; object-fit:cover; border-radius:6px; margin-top:6px; border:1px solid #2e3a4a;" />
  </div>
  <pre id="preview" style="white-space: pre-wrap; margin: 8px 0 0; font-size: 11px; color: #9ad; max-height: 140px; overflow:auto;"></pre>
  <div id="activity" style="margin-top:8px; font-size:11px; color:#9aa; max-height:120px; overflow:auto;"></div>
  <script src="popup.js"></script>
</body>
</html>
